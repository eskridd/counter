<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#110d11">
<title>T11</title>
<style>
:root {
  --bg: #110d11;
  --text: #f8edf3;
  --muted: #a58e9b;
  --accent: #ee91b9;
  --accent-soft: #bd6e98;
}

* {
  box-sizing: border-box;
  margin: 0;
}

html, body {
  min-height: 100%;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem 1rem;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.hearts {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}

.heart {
  position: absolute;
  bottom: -40px;
  color: var(--accent);
  opacity: 0;
  font-size: var(--size);
  animation: float var(--duration) linear infinite;
  animation-delay: var(--delay);
}

@keyframes float {
  0% {
    transform: translateY(0) rotate(0deg);
    opacity: 0;
  }
  15% {
    opacity: var(--opacity);
  }
  85% {
    opacity: var(--opacity);
  }
  100% {
    transform: translateY(-110vh) rotate(35deg);
    opacity: 0;
  }
}

main {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 850px;
  text-align: center;
  animation: appear 1.2s ease both;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(14px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.heart-icon {
  display: inline-block;
  margin-bottom: 1.5rem;
  color: var(--accent);
  font-size: 1.5rem;
  animation: heartbeat 2s ease-in-out infinite;
}

@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  15% { transform: scale(1.16); }
  30% { transform: scale(1); }
  45% { transform: scale(1.1); }
}

h1 {
  margin-bottom: 0.7rem;
  font-size: clamp(1.5rem, 5vw, 2.2rem);
  font-weight: 400;
  letter-spacing: -0.04em;
}

.subtitle {
  color: var(--muted);
  font-size: 0.9rem;
  letter-spacing: 0.04em;
}

.counter {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 2.5rem 1rem;
  margin-top: 4rem;
}

.unit {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.65rem;
}

.value {
  display: inline-block;
  color: var(--text);
  font-size: clamp(2.4rem, 8vw, 5rem);
  font-weight: 300;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.065em;
  line-height: 1;
  transition: color 0.3s ease;
}

.value.changed {
  animation: number-change 0.4s ease;
}

@keyframes number-change {
  0% {
    opacity: 0.35;
    transform: translateY(7px);
    color: var(--accent);
  }
  100% {
    opacity: 1;
    transform: translateY(0);
    color: var(--text);
  }
}

.unit small {
  color: var(--muted);
  font-size: 0.7rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
}

.footer {
  margin-top: 4rem;
  color: var(--muted);
  font-size: 0.8rem;
  letter-spacing: 0.04em;
}

.footer span {
  color: var(--accent);
}

@media (max-width: 550px) {
  .counter {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 2.5rem 1rem;
    margin-top: 3rem;
  }

  .value {
    font-size: clamp(2.8rem, 13vw, 4rem);
  }

  .footer {
    margin-top: 3rem;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>
<body>

<div class="hearts" aria-hidden="true">
  <span class="heart" style="--size:16px;--duration:17s;--delay:-2s;--opacity:.18;left:8%">♥</span>
  <span class="heart" style="--size:22px;--duration:22s;--delay:-12s;--opacity:.13;left:19%">♥</span>
  <span class="heart" style="--size:12px;--duration:19s;--delay:-7s;--opacity:.2;left:32%">♥</span>
  <span class="heart" style="--size:20px;--duration:24s;--delay:-16s;--opacity:.15;left:45%">♥</span>
  <span class="heart" style="--size:14px;--duration:18s;--delay:-4s;--opacity:.17;left:58%">♥</span>
  <span class="heart" style="--size:24px;--duration:25s;--delay:-19s;--opacity:.12;left:70%">♥</span>
  <span class="heart" style="--size:15px;--duration:20s;--delay:-9s;--opacity:.18;left:82%">♥</span>
  <span class="heart" style="--size:19px;--duration:23s;--delay:-14s;--opacity:.14;left:94%">♥</span>
</div>

<main>
  <div class="heart-icon">♥</div>

  <h1>Every moment with you</h1>
  <p class="subtitle">Since November 11, 2026</p>

  <section class="counter" aria-label="Time elapsed">
    <div class="unit">
      <span class="value" id="years">0</span>
      <small>Years</small>
    </div>
    <div class="unit">
      <span class="value" id="months">0</span>
      <small>Months</small>
    </div>
    <div class="unit">
      <span class="value" id="weeks">0</span>
      <small>Weeks</small>
    </div>
    <div class="unit">
      <span class="value" id="days">0</span>
      <small>Days</small>
    </div>
    <div class="unit">
      <span class="value" id="hours">00</span>
      <small>Hours</small>
    </div>
    <div class="unit">
      <span class="value" id="minutes">00</span>
      <small>Minutes</small>
    </div>
    <div class="unit">
      <span class="value" id="seconds">00</span>
      <small>Seconds</small>
    </div>
  </section>

  <p class="footer">
    Since <span>11.11.2026</span> · And counting ♥
  </p>
</main>

<script>
const start = Date.UTC(2026, 10, 10, 22, 36)

const ids = [
  "years", "months", "weeks", "days",
  "hours", "minutes", "seconds"
]

const elements = Object.fromEntries(
  ids.map(id => [id, document.getElementById(id)])
)

function addMonths(date, months) {
  const result = new Date(date)
  const day = result.getUTCDate()

  result.setUTCDate(1)
  result.setUTCMonth(result.getUTCMonth() + months)

  const lastDay = new Date(Date.UTC(
    result.getUTCFullYear(),
    result.getUTCMonth() + 1,
    0
  )).getUTCDate()

  result.setUTCDate(Math.min(day, lastDay))
  return result
}

function updateValue(id, value) {
  const element = elements[id]
  const formatted = String(value).padStart(
    ["hours", "minutes", "seconds"].includes(id) ? 2 : 1,
    "0"
  )

  if (element.textContent === formatted) return

  element.textContent = formatted
  element.classList.remove("changed")
  void element.offsetWidth
  element.classList.add("changed")
}

function tick() {
  const now = Date.now()
  let remaining = Math.max(0, Math.floor((now - start) / 1000))

  const beginning = new Date(start)
  const current = new Date(now)

  let years = current.getUTCFullYear() - beginning.getUTCFullYear()

  if (addMonths(beginning, years * 12).getTime() > now) {
    years--
  }

  remaining -= Math.floor(
    (addMonths(beginning, years * 12).getTime() - start) / 1000
  )

  let months = current.getUTCMonth() - beginning.getUTCMonth()
  months = (months + 12) % 12

  while (
    addMonths(beginning, years * 12 + months).getTime() > now
  ) {
    months--
  }

  const monthStart = addMonths(beginning, years * 12 + months)

  remaining = Math.max(
    0,
    Math.floor((now - monthStart.getTime()) / 1000)
  )

  const weeks = Math.floor(remaining / 604800)
  remaining %= 604800

  const days = Math.floor(remaining / 86400)
  remaining %= 86400

  const hours = Math.floor(remaining / 3600)
  remaining %= 3600

  const minutes = Math.floor(remaining / 60)
  const seconds = remaining % 60

  const values = {
    years, months, weeks, days, hours, minutes, seconds
  }

  for (const [id, value] of Object.entries(values)) {
    updateValue(id, value)
  }
}

tick()
setInterval(tick, 1000)
</script>

</body>
</html>
