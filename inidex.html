<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time since 11/11/26</title>
<style>
:root {
  --bg: #f7f7f5;
  --text: #1b1b1b;
  --muted: #7a7a76;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121212;
    --text: #f1f1ee;
    --muted: #8a8a85;
  }
}
* {
  box-sizing: border-box;
  margin: 0;
}
html,
body {
  height: 100%;
}
body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
.counter {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 1.5rem 3rem;
}
.unit {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 5rem;
}
.unit span {
  font-size: clamp(2.5rem, 10vw, 5.5rem);
  font-weight: 300;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}
.unit small {
  margin-top: 0.5rem;
  color: var(--muted);
}
</style>
</head>
<body>
<main class="counter">
  <div class="unit"><span id="days">0</span><small>days</small></div>
  <div class="unit"><span id="hours">00</span><small>hours</small></div>
  <div class="unit"><span id="minutes">00</span><small>minutes</small></div>
  <div class="unit"><span id="seconds">00</span><small>seconds</small></div>
</main>
<script>
const start = Date.UTC(2026, 10, 10, 22, 36)
const units = [["days", 86400], ["hours", 3600], ["minutes", 60], ["seconds", 1]]

function tick() {
  let left = Math.max(0, Math.floor((Date.now() - start) / 1000))
  for (const [id, size] of units) {
    const value = Math.floor(left / size)
    document.getElementById(id).textContent = id === "days" ? value : String(value).padStart(2, "0")
    left -= value * size
  }
}

tick()
setInterval(tick, 1000)
</script>
</body>
</html>
